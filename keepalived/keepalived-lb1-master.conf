# /etc/keepalived/keepalived.conf on edge-lb1 (192.168.50.11)
# Pair this with keepalived-lb2-backup.conf on edge-lb2 (192.168.50.12).
#
# Notes:
# - unicast (not multicast) VRRP is used deliberately: multicast VRRP is
#   flaky on a lot of consumer/managed switches and any Wi-Fi-adjacent
#   segment, and it's easy to have it silently fail. Unicast is a couple of
#   extra lines and is far more predictable on a small lab network.
# - VRRP's simple-text auth_pass is a protocol-level 8-byte field, not a
#   real credential -- keepalived will truncate/reject anything longer.
#   Treat it as a shared-segment sanity check, not a security boundary;
#   real isolation comes from putting edge-lb1/edge-lb2 on their own VLAN
#   (see security section).

global_defs {
    # Required by modern keepalived before it will run any vrrp_script at
    # all -- `keepalived -t` refuses to start otherwise ("SECURITY
    # VIOLATION - scripts are being executed but script_security not
    # enabled"), something the original project's docs never surfaced since
    # it never used keepalived in the first place. script_user runs the
    # check as an unprivileged account instead of root -- create it first:
    #   useradd --system --no-create-home --shell /usr/sbin/nologin keepalived_script
    enable_script_security
    script_user keepalived_script
}

vrrp_script chk_haproxy {
    # pidof (not `killall -0`): killall -0 sends a real signal and an
    # unprivileged script_user has no permission to signal a process owned
    # by root/haproxy, so it would always read as "down" even when haproxy
    # is healthy. pidof only reads /proc, no signal permission needed.
    script "/usr/bin/pidof haproxy"
    interval 2
    weight  2
    fall    2
    rise    2
}

vrrp_instance VI_1 {
    state MASTER
    interface eth0
    virtual_router_id 51
    priority 150
    advert_int 1

    unicast_src_ip 192.168.50.11
    unicast_peer {
        192.168.50.12
    }

    authentication {
        auth_type PASS
        auth_pass ch4ng3me
    }

    virtual_ipaddress {
        192.168.50.10/24
    }

    track_script {
        chk_haproxy
    }
}
