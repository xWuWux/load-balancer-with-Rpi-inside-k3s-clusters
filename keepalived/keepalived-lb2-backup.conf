# /etc/keepalived/keepalived.conf on edge-lb2 (192.168.50.12)
# Pair this with keepalived-lb1-master.conf on edge-lb1 (192.168.50.11).
# Only differences from lb1: state, priority, unicast_src_ip/peer.
# auth_pass MUST match lb1 exactly or the two will never see each other as
# a valid VRRP peer.

global_defs {
    enable_script_security
    script_user keepalived_script
}

vrrp_script chk_haproxy {
    script "/usr/bin/pidof haproxy"
    interval 2
    weight  2
    fall    2
    rise    2
}

vrrp_instance VI_1 {
    state BACKUP
    interface eth0
    virtual_router_id 51
    priority 100
    advert_int 1

    unicast_src_ip 192.168.50.12
    unicast_peer {
        192.168.50.11
    }

    authentication {
        auth_type PASS
        auth_pass ch4ng3me
    }

    virtual_ipaddress {
        192.168.50.10/24
    }

    track_script {
        chk_haproxy
    }
}
