# Grafana dashboards, pre-wired to the InfluxDB datasource via provisioning
# (so it's not a manual click-through step every time the pod restarts).
#
# Before applying, create the admin secret with a real password:
#   kubectl -n fog create secret generic grafana-admin \
#     --from-literal=admin-user=admin \
#     --from-literal=admin-password='<a real password>'
# and fill in the real InfluxDB org/bucket/token below to match
# k8s/20-influxdb.yaml's influxdb-admin secret.

apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: fog
data:
  influxdb.yaml: |
    apiVersion: 1
    datasources:
      - name: InfluxDB
        type: influxdb
        access: proxy
        url: http://influxdb.fog.svc.cluster.local:8086
        jsonData:
          version: Flux
          organization: fog-lab
          defaultBucket: sensors
          httpHeaderName1: Authorization
        secureJsonData:
          httpHeaderValue1: "Token CHANGE_ME_match_influxdb_admin_token"
        isDefault: true
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-data
  namespace: fog
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: fog
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      securityContext:
        fsGroup: 472   # grafana/grafana-oss image runs as uid 472; without
                        # this the PVC mounts root-owned and Grafana can't
                        # write its sqlite db.
      containers:
        - name: grafana
          image: grafana/grafana-oss:latest
          ports:
            - containerPort: 3000
          env:
            - name: GF_SECURITY_ADMIN_USER
              valueFrom:
                secretKeyRef: { name: grafana-admin, key: admin-user }
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef: { name: grafana-admin, key: admin-password }
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 400m
              memory: 384Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/grafana
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: grafana-data
        - name: datasources
          configMap:
            name: grafana-datasources
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: fog
spec:
  type: ClusterIP
  selector:
    app: grafana
  ports:
    - port: 3000
      targetPort: 3000
