# /etc/haproxy/haproxy.cfg
# Deployed IDENTICALLY on edge-lb1 (192.168.50.11) and edge-lb2 (192.168.50.12).
# Failover of the *load balancer tier itself* is handled by keepalived
# (see keepalived-lb1-master.conf / keepalived-lb2-backup.conf), not by HAProxy.
# HAProxy's only job here is: health-check the fog (k3s) nodes and spread/
# fail over connections across them. Validate with: haproxy -c -f haproxy.cfg

global
    log /dev/log local0
    log /dev/log local1 notice
    maxconn 4096
    user haproxy
    group haproxy
    daemon
    stats socket /run/haproxy/admin.sock mode 660 level admin
    stats timeout 30s

defaults
    log     global
    option  dontlognull
    option  http-server-close
    retries 3
    timeout http-request 10s
    timeout queue        1m
    timeout connect      10s
    timeout client       1m
    timeout server       1m
    timeout check        10s

# ---------------------------------------------------------------------------
# 1) HTTP -> HTTPS redirect only. No application traffic is served in the
#    clear. (Original project never terminated or even discussed TLS.)
# ---------------------------------------------------------------------------
frontend fe_http
    bind *:80
    mode http
    option httplog
    redirect scheme https code 301

# ---------------------------------------------------------------------------
# 2) HTTPS dashboards/API -> Traefik's NodePort inside the k3s cluster.
#    TLS is terminated at Traefik, not here: HAProxy passes the encrypted
#    stream through untouched (mode tcp), so SNI-based routing at Traefik
#    keeps working and HAProxy never needs the private key.
#    Traefik is k3s's built-in ingress controller (left enabled) and does the
#    L7 host-based routing to Grafana / Node-RED once traffic is inside the
#    cluster -- see k8s/50-ingress.yaml. This is the ONE place HTTP load
#    balancing happens; kube-proxy then spreads across pod replicas below
#    that. No third, redundant balancing layer.
#
#    Because this is TCP passthrough, HAProxy's usual `option forwardfor`
#    trick (adding an X-Forwarded-For HTTP header) is unavailable -- it
#    can't rewrite headers inside a stream it isn't decrypting. Instead the
#    servers below use `send-proxy-v2` (HAProxy PROXY protocol v2) so
#    Traefik learns the real client IP at the TCP layer; Traefik's
#    websecure entrypoint must be told to trust it (see
#    k8s/05-traefik-config.yaml's proxyProtocol.trustedIPs). Without one of
#    these two mechanisms, every request would appear to Traefik/Grafana/
#    Node-RED as if it came from edge-lb1/edge-lb2 -- fine for connectivity,
#    wrong for logging, rate-limiting or IP allow-lists.
# ---------------------------------------------------------------------------
frontend fe_https
    bind *:443
    mode tcp
    option tcplog
    default_backend be_traefik_https

backend be_traefik_https
    mode tcp
    balance leastconn
    option ssl-hello-chk
    default-server inter 3s fall 3 rise 2
    server fog-srv1   192.168.50.21:31443 send-proxy-v2 check
    server fog-agent1 192.168.50.22:31443 send-proxy-v2 check
    server fog-agent2 192.168.50.23:31443 send-proxy-v2 check

# ---------------------------------------------------------------------------
# 3) MQTT/TLS. MQTT is a stateful TCP protocol, NOT HTTP -- mode tcp is
#    mandatory (see errata #7/#9). Mosquitto runs as a single StatefulSet
#    replica (see k8s/10-mosquitto.yaml), so every fog node's NodePort
#    forwards to wherever that one pod currently lives, via kube-proxy --
#    that is what actually gives this "load balancer" its HA behaviour for
#    MQTT, not multi-broker round robin (round-robining independent broker
#    processes would break pub/sub session state; see the report's MQTT
#    scaling appendix for the EMQX/stick-table alternative if you outgrow a
#    single broker).
#    balance "first" + backup servers => always prefer fog-srv1's NodePort;
#    only spill to the agent nodes' NodePorts if that path is unreachable.
# ---------------------------------------------------------------------------
frontend fe_mqtt
    bind *:8883
    mode tcp
    option tcplog
    default_backend be_mqtt

backend be_mqtt
    mode tcp
    balance first
    default-server inter 3s fall 3 rise 2 maxconn 4096
    server fog-srv1   192.168.50.21:30883 check
    server fog-agent1 192.168.50.22:30883 check backup
    server fog-agent2 192.168.50.23:30883 check backup

# ---------------------------------------------------------------------------
# 4) Local stats/metrics page. Bound to loopback only -- reach it over SSH
#    tunnel or scrape it with the Prometheus haproxy_exporter from
#    localhost, never expose :8404 on the LAN/VIP (see security section).
# ---------------------------------------------------------------------------
listen stats
    bind 127.0.0.1:8404
    mode http
    stats enable
    stats uri /stats
    stats refresh 10s
